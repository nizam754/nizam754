<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mostafa Nizam — DevOps, Cloud and FinTech</title>
  <desc id="desc">A navy and teal banner for Mostafa Nizam, featuring cloud infrastructure, automation and reliable application delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.65" stop-color="#112b43"/>
      <stop offset="1" stop-color="#0b4b55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1195" cy="-25" r="190" fill="#2dd4bf" opacity="0.06"/>
    <circle cx="1130" cy="320" r="210" fill="#38bdf8" opacity="0.05"/>
    <rect x="54" y="54" width="5" height="184" rx="2.5" fill="url(#accent)"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="82" y="78" fill="#67e8f9" font-size="16" font-weight="600" letter-spacing="3">CLOUD · AUTOMATION · FINTECH</text>
      <text x="80" y="146" fill="#f8fafc" font-size="53" font-weight="700" letter-spacing="1">MOSTAFA NIZAM</text>
      <text x="82" y="187" fill="#cbd5e1" font-size="23">Reliable infrastructure. Repeatable delivery.</text>
      <text x="82" y="229" fill="#94a3b8" font-size="15" font-weight="600" letter-spacing="2">AWS  /  MICROSOFT AZURE  /  DEVOPS</text>
    </g>
    <g transform="translate(858 54)">
      <rect width="270" height="192" rx="16" fill="#0b1728" stroke="#32627a" stroke-width="1.5"/>
      <path d="M0 43H270" stroke="#25435a"/>
      <circle cx="23" cy="22" r="5" fill="#38bdf8"/>
      <circle cx="41" cy="22" r="5" fill="#5eead4"/>
      <circle cx="59" cy="22" r="5" fill="#64748b"/>
      <g font-family="Consolas, monospace" font-size="17">
        <text x="24" y="83" fill="#5eead4">&gt; build</text>
        <text x="24" y="121" fill="#7dd3fc">&gt; deploy</text>
        <text x="24" y="159" fill="#c4b5fd">&gt; observe</text>
      </g>
      <g fill="#5eead4">
        <circle cx="237" cy="78" r="4"/>
        <circle cx="237" cy="116" r="4"/>
        <circle cx="237" cy="154" r="4"/>
      </g>
    </g>
  </g>
</svg>
